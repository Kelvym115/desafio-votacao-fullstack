spring:
  application:
    name: votacao
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/votacao;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
logging:
  level:
    # A aplicação trata violações de unicidade sem registrar o conteúdo do voto.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
